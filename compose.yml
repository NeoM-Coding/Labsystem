name: lab-system-cloud

x-java-service: &java-service
  image: ${JAVA_RUNTIME_IMAGE:-eclipse-temurin:17-jre-jammy}
  profiles: [app]
  restart: unless-stopped
  init: true
  working_dir: /app
  entrypoint: ["/bin/sh", "/opt/lab/hot-reload.sh"]
  stop_grace_period: 30s
  environment: &java-environment
    TZ: ${TZ:-Asia/Shanghai}
    JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8}
    HOT_RELOAD_INTERVAL_SECONDS: ${HOT_RELOAD_INTERVAL_SECONDS:-2}
    HOT_RELOAD_SETTLE_SECONDS: ${HOT_RELOAD_SETTLE_SECONDS:-2}
    APP_RESTART_DELAY_SECONDS: ${APP_RESTART_DELAY_SECONDS:-3}
    MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lab-system-local}
    AES_KEY: ${AES_KEY:-0123456789abcdef}
    LAB_DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-lab_sys}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    UID_DB_URL: jdbc:mysql://mysql:3306/${UID_DATABASE:-fun_cloud_base}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_DATABASE: ${REDIS_DATABASE:-0}
    REDIS_USERNAME: ${REDIS_USERNAME:-}
    REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    MQTT_HOST: emqx
    MQTT_PORT: 1883
    PERMIFY_HOST: permify
    PERMIFY_HTTP_PORT: 3476
    PERMIFY_TENANT_ID: ${PERMIFY_TENANT_ID:-t1}
    PERMIFY_SCHEMA_VERSION: ${PERMIFY_SCHEMA_VERSION:-}
    PERMIFY_DEPTH: ${PERMIFY_DEPTH:-20}
    PERMIFY_LOOKUP_PAGE_SIZE: ${PERMIFY_LOOKUP_PAGE_SIZE:-100}
    NACOS_HOST: nacos
    NACOS_PORT: 8848
    NACOS_USERNAME: ${NACOS_USERNAME:-}
    NACOS_PASSWORD: ${NACOS_PASSWORD:-}
    NACOS_NAMESPACE: ${NACOS_NAMESPACE:-public}
    NACOS_REGISTRY_GROUP: ${NACOS_REGISTRY_GROUP:-LAB_SYSTEM}
    NACOS_CONFIG_GROUP: ${NACOS_CONFIG_GROUP:-LAB_SYSTEM}
    DUBBO_QOS_ENABLE: ${DUBBO_QOS_ENABLE:-false}
    DUBBO_PROVIDER_TIMEOUT: ${DUBBO_PROVIDER_TIMEOUT:-5000}
    DUBBO_CONSUMER_TIMEOUT: ${DUBBO_CONSUMER_TIMEOUT:-5000}
    DUBBO_LOG_LEVEL: ${DUBBO_LOG_LEVEL:-WARN}
    TRACING_ENABLED: ${TRACING_ENABLED:-true}
    TRACING_MAX_ARGUMENT_LENGTH: ${TRACING_MAX_ARGUMENT_LENGTH:-2048}
    TRACING_MAX_COLLECTION_SIZE: ${TRACING_MAX_COLLECTION_SIZE:-20}
    TRACING_MAX_DEPTH: ${TRACING_MAX_DEPTH:-3}
    LOG_PATH: /app/logs
  healthcheck: &java-healthcheck
    test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/$${APP_HEALTH_PORT}"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 20s

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0.44}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-lab-system-local}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lab_sys}
      UID_DATABASE: ${UID_DATABASE:-fun_cloud_base}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init/00-databases.sh:/docker-entrypoint-initdb.d/00-databases.sh:ro
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/10-lab-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: ${REDIS_IMAGE:-redis:8.8.0-alpine}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - /bin/sh
      - -c
      - |
        if [ -n "$${REDIS_PASSWORD}" ]; then
          exec redis-server --appendonly yes --save 60 1 --requirepass "$${REDIS_PASSWORD}"
        fi
        exec redis-server --appendonly yes --save 60 1
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 3s
      retries: 20

  emqx:
    image: ${EMQX_IMAGE:-emqx/emqx:5.8.5}
    restart: unless-stopped
    hostname: emqx
    environment:
      EMQX_NODE_NAME: emqx@emqx
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USERNAME:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-public123}
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-8083}:8083"
      - "${MQTT_WSS_PORT:-8084}:8084"
      - "${MQTT_TLS_PORT:-8883}:8883"
      - "${EMQX_DASHBOARD_PORT:-18083}:18083"
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18083/status"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  permify-postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.10-alpine3.23}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_DB: ${PERMIFY_POSTGRES_DATABASE:-permify}
      POSTGRES_USER: ${PERMIFY_POSTGRES_USERNAME:-permify}
      POSTGRES_PASSWORD: ${PERMIFY_POSTGRES_PASSWORD:-permify-local}
    ports:
      - "${PERMIFY_POSTGRES_PORT:-5433}:5432"
    volumes:
      - permify-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  permify:
    image: ${PERMIFY_IMAGE:-ghcr.io/permify/permify:v1.6.7}
    restart: unless-stopped
    environment:
      PERMIFY_DATABASE_ENGINE: postgres
      PERMIFY_DATABASE_URI: postgres://${PERMIFY_POSTGRES_USERNAME:-permify}:${PERMIFY_POSTGRES_PASSWORD:-permify-local}@permify-postgres:5432/${PERMIFY_POSTGRES_DATABASE:-permify}?sslmode=disable
      PERMIFY_DATABASE_AUTO_MIGRATE: "true"
    ports:
      - "${PERMIFY_HTTP_PORT:-3476}:3476"
      - "${PERMIFY_GRPC_PORT:-3478}:3478"
    depends_on:
      permify-postgres:
        condition: service_healthy

  nacos:
    image: ${NACOS_IMAGE:-nacos/nacos-server:v3.2.3}
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-false}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-bGFiLXN5c3RlbS1jbG91ZC1sb2NhbC1uYWNvcy10b2tlbi0yMDI2}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-lab-system}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-lab-system-local}
    ports:
      - "${NACOS_CONSOLE_PORT:-8080}:8080"
      - "${NACOS_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8848/nacos/v3/admin/core/state/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.7.3}
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./observability/docker/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki

  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.16.1}
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    ports:
      - "${ALLOY_PORT:-12345}:12345"
    volumes:
      - ./observability/docker/config.alloy:/etc/alloy/config.alloy:ro
      - ${LOG_PATH:-./logs}:/var/log/lab-system:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.1.0}
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/docker/grafana-datasources.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_started

  base-service:
    <<: *java-service
    environment:
      <<: *java-environment
      APP_JAR: /app/artifacts/base-0.0.1.jar
      APP_HEALTH_PORT: ${BASE_SERVER_PORT:-3332}
      BASE_SERVER_PORT: ${BASE_SERVER_PORT:-3332}
      BASE_DUBBO_PORT: ${BASE_DUBBO_PORT:-50051}
      BASE_DUBBO_QOS_PORT: ${BASE_DUBBO_QOS_PORT:-22221}
    volumes:
      - ./infra/java/hot-reload.sh:/opt/lab/hot-reload.sh:ro
      - ./base/target:/app/artifacts:ro
      - ${LOG_PATH:-./logs}:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      permify:
        condition: service_started
      nacos:
        condition: service_healthy

  mqtt-service:
    <<: *java-service
    environment:
      <<: *java-environment
      APP_JAR: /app/artifacts/mqtt-0.0.1.jar
      APP_HEALTH_PORT: ${MQTT_SERVER_PORT:-3333}
      MQTT_SERVER_PORT: ${MQTT_SERVER_PORT:-3333}
      MQTT_DUBBO_PORT: ${MQTT_DUBBO_PORT:-50052}
      MQTT_DUBBO_QOS_PORT: ${MQTT_DUBBO_QOS_PORT:-22222}
    volumes:
      - ./infra/java/hot-reload.sh:/opt/lab/hot-reload.sh:ro
      - ./mqtt/target:/app/artifacts:ro
      - ${LOG_PATH:-./logs}:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy
      nacos:
        condition: service_healthy

  rule-engine-service:
    <<: *java-service
    environment:
      <<: *java-environment
      APP_JAR: /app/artifacts/rule-engine-0.0.1.jar
      APP_HEALTH_PORT: ${RULE_ENGINE_SERVER_PORT:-3334}
      RULE_ENGINE_SERVER_PORT: ${RULE_ENGINE_SERVER_PORT:-3334}
      RULE_ENGINE_DUBBO_PORT: ${RULE_ENGINE_DUBBO_PORT:-50053}
      RULE_ENGINE_DUBBO_QOS_PORT: ${RULE_ENGINE_DUBBO_QOS_PORT:-22223}
      RULE_ENGINE_PERSISTENCE_ENABLED: ${RULE_ENGINE_PERSISTENCE_ENABLED:-true}
      RULE_ENGINE_SIMPLE_TEST_ENABLED: ${RULE_ENGINE_SIMPLE_TEST_ENABLED:-false}
    volumes:
      - ./infra/java/hot-reload.sh:/opt/lab/hot-reload.sh:ro
      - ./rule-engine/target:/app/artifacts:ro
      - ${LOG_PATH:-./logs}:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      permify:
        condition: service_started
      nacos:
        condition: service_healthy

  web-service:
    <<: *java-service
    environment:
      <<: *java-environment
      APP_JAR: /app/artifacts/web-0.0.1.jar
      APP_HEALTH_PORT: ${WEB_SERVER_PORT:-8989}
      WEB_SERVER_PORT: ${WEB_SERVER_PORT:-8989}
      WEB_DUBBO_QOS_PORT: ${WEB_DUBBO_QOS_PORT:-22224}
    ports:
      - "${WEB_SERVER_PORT:-8989}:${WEB_SERVER_PORT:-8989}"
    volumes:
      - ./infra/java/hot-reload.sh:/opt/lab/hot-reload.sh:ro
      - ./web/target:/app/artifacts:ro
      - ${LOG_PATH:-./logs}:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      permify:
        condition: service_started
      nacos:
        condition: service_healthy

volumes:
  mysql-data:
  permify-postgres-data:
  redis-data:
  emqx-data:
  emqx-log:
  loki-data:
  alloy-data:
  grafana-data:
