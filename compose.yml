name: lab-system-cloud

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0.44}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-lab-system-local}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lab_sys}
      UID_DATABASE: ${UID_DATABASE:-fun_cloud_base}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init/00-databases.sh:/docker-entrypoint-initdb.d/00-databases.sh:ro
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/10-lab-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: ${REDIS_IMAGE:-redis:8.8.0-alpine}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - /bin/sh
      - -c
      - |
        if [ -n "$${REDIS_PASSWORD}" ]; then
          exec redis-server --appendonly yes --save 60 1 --requirepass "$${REDIS_PASSWORD}"
        fi
        exec redis-server --appendonly yes --save 60 1
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 3s
      retries: 20

  emqx:
    image: ${EMQX_IMAGE:-emqx/emqx:5.8.5}
    restart: unless-stopped
    hostname: emqx
    environment:
      EMQX_NODE_NAME: emqx@emqx
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USERNAME:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-public123}
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-8083}:8083"
      - "${MQTT_WSS_PORT:-8084}:8084"
      - "${MQTT_TLS_PORT:-8883}:8883"
      - "${EMQX_DASHBOARD_PORT:-18083}:18083"
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx_ctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  permify:
    image: ${PERMIFY_IMAGE:-ghcr.io/permify/permify:v1.6.7}
    restart: unless-stopped
    ports:
      - "${PERMIFY_HTTP_PORT:-3476}:3476"
      - "${PERMIFY_GRPC_PORT:-3478}:3478"
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "wget -qO- http://127.0.0.1:3476/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  nacos:
    image: ${NACOS_IMAGE:-nacos/nacos-server:v3.2.3}
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-false}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-bGFiLXN5c3RlbS1jbG91ZC1sb2NhbC1uYWNvcy10b2tlbi0yMDI2}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-lab-system}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-lab-system-local}
    ports:
      - "${NACOS_CONSOLE_PORT:-8080}:8080"
      - "${NACOS_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8848/nacos/v3/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.7.3}
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./observability/docker/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 20

  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.16.1}
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    ports:
      - "${ALLOY_PORT:-12345}:12345"
    volumes:
      - ./observability/docker/config.alloy:/etc/alloy/config.alloy:ro
      - ${LOG_PATH:-./logs}:/var/log/lab-system:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.1.0}
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/docker/grafana-datasources.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  emqx-data:
  emqx-log:
  loki-data:
  alloy-data:
  grafana-data:
