spring:
  application:
    name: lab-system-mqtt
  datasource:
    url: ${LAB_DB_URL:jdbc:mysql://localhost:3306/lab_sys?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:lab-system-local}

# UID worker 节点使用 server.port 参与实例标识；非 Web provider 也需要保留该属性。
server:
  port: ${MQTT_SERVER_PORT:3333}

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

fun:
  uid:
    assigner-mode: db
    generator-mode: none
    datasource:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: ${UID_DB_URL:jdbc:mysql://localhost:3306/fun_cloud_base?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:lab-system-local}

dubbo:
  application:
    name: ${spring.application.name}
    logger: slf4j
    qos-enable: ${DUBBO_QOS_ENABLE:false}
    qos-port: ${MQTT_DUBBO_QOS_PORT:22222}
  protocol:
    name: tri
    port: ${MQTT_DUBBO_PORT:50052}
  provider:
    timeout: ${DUBBO_PROVIDER_TIMEOUT:5000}
  registry:
    address: nacos://${NACOS_HOST:localhost}:${NACOS_PORT:8848}
    username: ${NACOS_USERNAME:}
    password: ${NACOS_PASSWORD:}
    group: ${NACOS_REGISTRY_GROUP:LAB_SYSTEM}
    parameters:
      namespace: ${NACOS_NAMESPACE:public}
  config-center:
    address: nacos://${NACOS_HOST:localhost}:${NACOS_PORT:8848}
    username: ${NACOS_USERNAME:}
    password: ${NACOS_PASSWORD:}
    namespace: ${NACOS_NAMESPACE:public}
    group: ${NACOS_CONFIG_GROUP:LAB_SYSTEM}

mqtt:
  connect:
    url: tcp://${MQTT_HOST:localhost}:${MQTT_PORT:1883}
    qos: at_least_once
  poll:
    interval-millis: ${MQTT_POLL_INTERVAL_MILLIS:10000}
    timeout-millis: ${MQTT_POLL_TIMEOUT_MILLIS:15000}
    watchdog-interval-millis: ${MQTT_POLL_WATCHDOG_INTERVAL_MILLIS:60000}
  gateway:
    watchdog-interval-millis: ${MQTT_GATEWAY_WATCHDOG_INTERVAL_MILLIS:60000}

lab:
  redis:
    enabled: true
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}
    username: ${REDIS_USERNAME:}
    password: ${REDIS_PASSWORD:}
    timeout-millis: 15000
    pool:
      max-total: 16
      max-idle: 8
      min-idle: 0
      max-wait-millis: 2000
      test-on-borrow: true
  observability:
    tracing:
      enabled: ${TRACING_ENABLED:true}
      max-argument-length: ${TRACING_MAX_ARGUMENT_LENGTH:2048}
      max-collection-size: ${TRACING_MAX_COLLECTION_SIZE:20}
      max-depth: ${TRACING_MAX_DEPTH:3}
