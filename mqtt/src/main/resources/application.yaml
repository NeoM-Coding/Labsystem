spring:
  application:
    name: mqtt

  datasource:
    url: ${LAB_DB_URL:jdbc:mysql://localhost:3306/lab_sys?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:lab-system-local}

server:
  port: 3333

dubbo:
  application:
    name: ${spring.application.name}
    qos-port: 4444
  provider:
    timeout: 5_000
  registry:
    address: nacos://${NACOS_HOST:localhost}:${NACOS_PORT:8848}
  config-center:
    address: nacos://${NACOS_HOST:localhost}:${NACOS_PORT:8848}

mqtt:
  connect:
    url: tcp://${MQTT_HOST:localhost}:${MQTT_PORT:1883}
    qos: at_least_once
  poll:
    interval-millis: 10_000
    timeout-millis: 15_000
    watchdog-interval-millis: 60_000
  gateway:
    watchdog-interval-millis: 60_000

lab:
  redis:
    enabled: true
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout-millis: 15_000
    pool:
      max-total: 16
      max-idle: 8
      min-idle: 0
      max-wait-millis: 2_000
      test-on-borrow: true
