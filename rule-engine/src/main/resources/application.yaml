spring:
  application:
    name: rule-engine

  datasource:
    url: ${LAB_DB_URL:jdbc:mysql://localhost:3306/lab_sys?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:lab-system-local}

server:
  port: 3334

dubbo:
  application:
    name: ${spring.application.name}
    qos-port: 4445
  provider:
    timeout: 5_000
  registry:
    address: nacos://${NACOS_HOST:localhost}:${NACOS_PORT:8848}
  config-center:
    address: nacos://${NACOS_HOST:localhost}:${NACOS_PORT:8848}

lab:
  auth:
    permify:
      enabled: ${PERMIFY_AUTH_ENABLED:true}
      base-url: http://${PERMIFY_HOST:localhost}:${PERMIFY_HTTP_PORT:3476}
      tenant-id: ${PERMIFY_TENANT_ID:t1}
      schema-version: ""
      depth: 20
  rule-engine:
    persistence:
      enabled: true
    simple-test:
      # 当前开启真实链路演示；生产环境不需要时应覆盖为 false。
      enabled: false
      runtime-id: simple-real-chain-runtime
      source-device-id: 5
      temperature-threshold: 23
      control-device-id: 5
      time-point-delay-seconds: 30
      zone-id: Asia/Shanghai

  redis:
    enabled: true
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout-millis: 15_000
    pool:
      max-total: 16
      max-idle: 8
      min-idle: 0
      max-wait-millis: 2_000
      test-on-borrow: true
