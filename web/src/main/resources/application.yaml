spring:
  application:
    name: lab-system-web

sa-token:
  alone-redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}
    username: ${REDIS_USERNAME:}
    password: ${REDIS_PASSWORD:}

server:
  port: 8989

fun:
  uid:
    assigner-mode: none

lab:
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}
    username: ${REDIS_USERNAME:}
    password: ${REDIS_PASSWORD:}
    key-prefix: lab
  auth:
    permify:
      enabled: true
      base-url: http://${PERMIFY_HOST:localhost}:${PERMIFY_HTTP_PORT:3476}
      tenant-id: ${PERMIFY_TENANT_ID:t1}
      schema-version: ""
      depth: 20
      lookup-page-size: 100

dubbo:
  application:
    name: ${spring.application.name}
    qos-port: 5555
  consumer:
    timeout: 5_000
  registry:
    address: nacos://${NACOS_HOST:localhost}:${NACOS_PORT:8848}
  config-center:
    address: nacos://${NACOS_HOST:localhost}:${NACOS_PORT:8848}
